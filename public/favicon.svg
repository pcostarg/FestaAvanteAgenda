<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#E53935" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#D32F2F" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0D0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Background -->
  <rect width="512" height="512" rx="104" fill="#0B0D0F"/>
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#282E38" stroke-width="2"/>

  <!-- Concentric Acoustic Pulse Rings -->
  <circle cx="256" cy="235" r="180" fill="none" stroke="#E53935" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="256" cy="235" r="140" fill="none" stroke="#E53935" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="235" r="105" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="3"/>

  <!-- 5-Pointed Avante Festival Star -->
  <polygon points="
    256,140
    278,206
    348,206
    291,247
    313,313
    256,272
    199,313
    221,247
    164,206
    234,206
  " fill="url(#crimsonGrad)" filter="url(#glow)"/>

  <!-- Star Shading Facets -->
  <polygon points="256,140 256,272 199,313 221,247 164,206 234,206" fill="#D32F2F" fill-opacity="0.55"/>
  <polygon points="256,140 278,206 256,272" fill="#FFA4A2" fill-opacity="0.45"/>

  <!-- Central Live Pulse Dot -->
  <circle cx="256" cy="235" r="11" fill="#F8FAFC"/>

  <!-- Brand Typography -->
  <text x="256" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#F8FAFC" letter-spacing="6">AVANTE</text>
  <text x="256" y="414" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="18" fill="#F59E0B" letter-spacing="8">2026</text>
</svg>
